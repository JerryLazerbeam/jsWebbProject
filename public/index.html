<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Manager</h1>
    </header>
    <main>
        <h2>Produktadministration</h2>

        <form id="product-form">

            <div class="form-group">
                <label for="name">Produktnamn</label>
                <input type="text" id="name" name="name" class="form-input" required>
            </div>

            <div class="form-group">
                <label for="price">Pris</label>
                <input type="number" id="price" name="price" min="1" class="form-input" required>
            </div>

            <div class="form-group">
                <label for="SKU">SKU</label>
                <input type="text" id="SKU" name="SKU" pattern="[A-Z]{3}-[0-9]{3}" placeholder="ABC-123"
                    class="form-input" required>
            </div>

            <div class="form-group full-width">
                <label for="description">Beskrivning</label>
                <textarea id="description" name="description" class="form-input" required></textarea>
            </div>

            <div class="full-width button-container">
                <button id="add-product">Lägg till produkt</button>
            </div>

        </form>

        <table>
            <thead>
                <tr>
                    <th>Produkt</th>
                    <th>SKU</th>
                    <th>Pris</th>
                    <th>Åtgärder</th>
                </tr>
            </thead>

            <tbody id="product-list">
                <!-- Produkterna läggs till med JavaScript -->
            </tbody>
        </table>

        </div>
    </main>
    <script src="/js/product.js" defer>
    </script>

</body>

</html>
